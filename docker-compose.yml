services:
  immich-tagger:
    build: .
    container_name: immich-auto-tagger
    environment:
      - IMMICH_BASE_URL=${IMMICH_BASE_URL}
      - IMMICH_API_KEY=${IMMICH_API_KEY} # Legacy single key support
      - IMMICH_API_KEYS=${IMMICH_API_KEYS} # Choose either this or IMMICH_LIBRARIES
      - IMMICH_LIBRARIES=${IMMICH_LIBRARIES}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.35}
      - BATCH_SIZE=${BATCH_SIZE:-250}
      - INFERENCE_BATCH_SIZE=${INFERENCE_BATCH_SIZE:-8}
      - CHARACTER_THRESHOLD=${CHARACTER_THRESHOLD:-0.9}
      - WD_MODEL_REPO=${WD_MODEL_REPO:-SmilingWolf/wd-swinv2-tagger-v3}
      - ONNX_INTRA_OP_THREADS=${ONNX_INTRA_OP_THREADS:-0}
      - UNLOAD_MODEL_AFTER_RUN=${UNLOAD_MODEL_AFTER_RUN:-false}
      - PROCESSED_TAG_NAME=${PROCESSED_TAG_NAME:-auto:processed}
      - CONTENT_RATING_TAG_NAME=${CONTENT_RATING_TAG_NAME:-content-rating}
      - TARGET_ALBUMS=${TARGET_ALBUMS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-true}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 2 * * *}
      - TIMEZONE=${TIMEZONE:-UTC}
      - FAILURE_TIMEOUT=${FAILURE_TIMEOUT:-3}
      - TAG_CACHE_TTL=${TAG_CACHE_TTL:-300}
      - CONFIG_DIR=/config
      - MODEL_CACHE_DIR=/config/models
    volumes:
      - ./config:/config  # Model cache and per-library failure state
    ports:
      - "8000:8000"  # Health endpoint
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
